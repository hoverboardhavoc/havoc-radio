<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Havoc Radio</title>
<style>
:root { --bg: #f4f5f2; --card: #fff; --ink: #1d2320; --muted: #5d6762; --line: #d5dad6; --accent: #2f7d6b; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121514; --card: #1a1e1c; --ink: #e3e8e4; --muted: #98a39d; --line: #2c3330; --accent: #5fbfa6; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
nav { display: flex; gap: 4px; }
nav a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; }
nav a.on { color: var(--accent); border-color: var(--accent); }
.clock { font: 600 1rem ui-monospace, Menlo, monospace; flex-basis: 100%; }
.clock small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.view { display: grid; gap: 14px; }
.view[hidden] { display: none; }
.switch { display: flex; flex-direction: row; gap: 8px; align-items: center; color: var(--ink); font-size: 1rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0 0; color: var(--muted); font-size: 0.85rem; }
dd { margin: 0; }
h1 { font-size: 1.3rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 8px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.freq { font: 600 2.6rem/1.1 ui-monospace, Menlo, monospace; }
.freq small { font-size: 1rem; color: var(--muted); margin-left: 6px; }
.meta { color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
label { display: grid; gap: 4px; color: var(--muted); font-size: 0.85rem; }
input, select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=range] { width: 100%; padding: 0; }
table { width: 100%; border-collapse: collapse; }
td { padding: 4px 2px; border-top: 1px solid var(--line); }
td.f { color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
td.a { text-align: right; white-space: nowrap; }
td.a button { padding: 2px 7px; }
.bars { font-family: ui-monospace, Menlo, monospace; letter-spacing: -1px; }
#status { color: var(--muted); font: 400 0.85rem system-ui, -apple-system, "Segoe UI", sans-serif; margin-left: 6px; }
#otaMsg { color: var(--muted); }
#fwMsg { color: var(--muted); margin: 8px 0 4px; }
#timeMsg { color: var(--muted); margin: 6px 0 0; }
#timeMsg:empty { display: none; }
.rds { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; display: grid; gap: 4px; }
.ps { font: 700 1.35rem/1.2 ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
.rt { min-height: 1.45em; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 0.8rem; }
.tag.on { border-color: var(--accent); color: var(--accent); }
.mono { font-family: ui-monospace, Menlo, monospace; }
.nosig { color: var(--muted); font-style: italic; }
.af a { color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
.guide { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 6px; overflow-x: auto; }
.guide th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.8rem; padding: 2px; }
.guide td { font-size: 0.9rem; }
.guide td:first-child, .guide td:nth-child(2) { font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
.guide tr.on td { color: var(--accent); font-weight: 600; }
#guideMsg { color: var(--muted); margin: 6px 0 0; }
#guideMsg:empty { display: none; }
#scanMsg { color: var(--muted); margin: 8px 0 0; }
#scanMsg:empty { display: none; }
.scan td:nth-child(2) { font-family: inherit; white-space: normal; }
.scan td:nth-child(n+3) { white-space: nowrap; }
.scan tbody tr { cursor: pointer; }
#screen { display: block; width: 100%; image-rendering: pixelated; border-radius: 6px; }
.controls { display: flex; gap: 28px; align-items: center; justify-content: center; margin-top: 14px; }
#knob { width: 160px; height: 160px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#sideBtn { width: 54px; height: 54px; padding: 0; border-radius: 50%; border-color: #3a4146; touch-action: none;
  background: radial-gradient(circle at 40% 35%, #4b535a, #23282c); }
#sideBtn:active { transform: translateY(1px); background: #1d2124; }
#knob:focus-visible, #sideBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 50%; }
#knobHint, #knobMsg { color: var(--muted); font-size: 0.85rem; margin: 10px 0 0; text-align: center; }
#knobMsg:empty { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Havoc Radio</h1>
    <nav><a href="#" data-view="radio" data-t="web_radio"></a><a href="#settings" data-view="settings" data-t="web_settings"></a>
      <a href="#screen" data-view="screen" data-t="web_screen"></a></nav>
    <span class="clock"><span id="clock"></span> <span id="status"></span></span>
  </header>

  <div class="view" id="radioView">
  <section>
    <div class="freq"><span id="freq">--</span><small id="unit"></small></div>
    <div class="meta"><span id="band"></span><span id="mode"></span><span><span data-t="web_signal"></span>
      <span class="bars" id="bars"></span> <span id="rssi"></span></span></div>
    <div class="rds" id="rds" hidden></div>
    <div class="guide" id="guide" hidden>
      <table><thead><tr><th data-t="time"></th><th data-t="web_days"></th><th data-t="web_name"></th>
        <th data-t="language"></th><th data-t="web_target"></th></tr></thead><tbody id="guideRows"></tbody></table>
    </div>
    <div class="row">
      <button id="down" type="button">&minus;</button>
      <input id="tuneIn" inputmode="decimal" size="10">
      <button id="tune" type="button" class="primary" data-t="web_tune"></button>
      <button id="up" type="button">+</button>
    </div>
  </section>

  <section id="scanCard" hidden>
    <h2 data-t="web_scan"></h2>
    <div class="row" style="margin-top:0">
      <button id="scanBand" type="button" class="primary" data-t="scan_band"></button>
      <button id="scanAll" type="button" data-t="scan_all"></button>
      <button id="scanStop" type="button" data-t="web_stop" hidden></button>
    </div>
    <p id="scanMsg"></p>
    <div class="guide scan" id="scanTable" hidden>
      <table><thead><tr><th>kHz</th><th data-t="web_name"></th><th>RSSI</th><th>SNR</th></tr></thead>
        <tbody id="scanRows"></tbody></table>
    </div>
  </section>

  <section class="grid">
    <label><span data-t="band"></span><select id="bandSel"></select></label>
    <label><span data-t="mode"></span><select id="modeSel"></select></label>
    <label><span data-t="step"></span><select id="stepSel"></select></label>
    <label><span data-t="bandwidth"></span><select id="bwSel"></select></label>
    <label><span data-t="volume"></span><input id="vol" type="range" min="0" max="63"></label>
    <label><span data-t="side_mute"></span><input id="mute" type="checkbox"></label>
  </section>

  <section>
    <h2 data-t="web_presets"></h2>
    <table><tbody id="presets"></tbody></table>
    <div class="row">
      <input id="presetName" maxlength="10" data-ph="web_name">
      <button id="presetAdd" type="button" data-t="web_add"></button>
    </div>
  </section>
  </div>

  <div class="view" id="settingsView" hidden>

  <section>
    <h2 data-t="wifi"></h2>
    <div id="wifiState" class="meta"></div>
    <div class="row">
      <input id="ssid" maxlength="32" data-ph="web_network">
      <input id="pass" type="password" maxlength="64" data-ph="web_password">
      <button id="join" type="button" data-t="web_join"></button>
    </div>
  </section>

  <section>
    <h2 data-t="time"></h2>
    <label class="switch"><input id="timeSync" type="checkbox"> <span><span data-t="time_sync"></span> (NTP)</span></label>
    <div class="row">
      <input id="server" maxlength="63" size="24" autocapitalize="off" spellcheck="false" data-ph="ntp_server">
      <button id="serverSave" type="button" class="primary" data-t="web_save"></button>
      <button id="serverDefault" type="button" data-t="web_default"></button>
    </div>
    <p id="timeMsg"></p>
    <div id="timeInfo"></div>
  </section>

  <section>
    <h2 data-t="guide"></h2>
    <div id="guideInfo" class="meta"></div>
    <div class="row">
      <button id="guideUpdate" type="button" class="primary" data-t="web_update"></button>
      <button id="guideFrom" type="button" data-t="web_from_file"></button>
      <input id="guideFile" type="file" accept=".bin" hidden>
    </div>
    <p id="guideMsg"></p>
    <p class="meta">EiBi, <a href="http://www.eibispace.de/">eibispace.de</a>, by Eike Bierwirth</p>
  </section>

  <section>
    <h2 data-t="web_firmware"></h2>
    <div class="meta"><span id="version"></span><span id="battery"></span></div>
    <div class="row">
      <button id="fwCheck" type="button" class="primary" data-t="web_check_update"></button>
    </div>
    <p id="fwMsg"></p>
    <div class="row">
      <input id="fw" type="file" accept=".bin">
      <button id="upload" type="button" data-t="web_upload"></button>
    </div>
    <p id="otaMsg"></p>
  </section>
  </div>

  <div class="view" id="screenView" hidden>
  <section><canvas id="screen" width="512" height="128"></canvas>
    <div class="controls">
      <svg id="knob" viewBox="-100 -100 200 200" tabindex="0" role="button" aria-labelledby="knobHint">
        <defs><radialGradient id="knobGrad" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4a5258"/>
          <stop offset="1" stop-color="#2b3034"/></radialGradient>
          <radialGradient id="capGrad" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#5a636a"/>
          <stop offset="1" stop-color="#2a2f33"/></radialGradient></defs>
        <circle r="96" fill="#0f1213"/>
        <g id="knobRot"><circle r="88" fill="url(#knobGrad)" stroke="#11151a" stroke-width="2"/><g id="ridges"></g>
          <circle cx="0" cy="-74" r="4" fill="#c9d2d8"/></g>
        <circle r="40" fill="url(#capGrad)" stroke="#11151a" stroke-width="2"/>
      </svg>
      <button id="sideBtn" type="button" aria-labelledby="knobHint"></button>
    </div>
    <p id="knobHint" data-t="web_knob"></p>
    <p id="knobMsg"></p>
  </section>
  </div>
</main>
<script id="lib">
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// The RDS part of the frequency card, as HTML, for the state's `rds` (null outside FM) and tuned frequency `hz`.
// `t` looks up a string. Each other FM frequency of the station is a link that tunes to it; LW and MW ones are text.
function rdsHtml(r, hz, t) {
  if (!r) return '';
  if (!r.sync) return `<div class="nosig">${esc(t('web_rds_searching'))}</div>`;
  const tags = [];
  if (r.pty) tags.push(`<span class="tag">${esc(t('pty_' + r.pty))}</span>`);
  if (r.tp) tags.push(`<span class="tag${r.ta ? ' on' : ''}">TP</span>`);
  if (r.pi) tags.push(`<span class="mono">PI ${esc(r.pi)}</span>`);
  const af = r.af.filter(f => f !== hz).map(f => f >= 64e6 ? `<a href="#" data-hz="${f}">${(f / 1e6).toFixed(1)}</a>`
    : `<span>${f / 1e3}k</span>`);
  return `<div class="ps">${esc(r.ps)}</div><div class="rt">${esc(r.rt)}</div>` +
    (tags.length ? `<div class="meta">${tags.join('')}</div>` : '') +
    (af.length ? `<div class="meta af">${esc(t('web_also_on'))} ${af.join(' ')}</div>` : '');
}
// A translated string with %d and %s filled in order; %% is a percent sign.
function fmt(s, ...a) { return s.replace(/%[ds%]/g, m => m === '%%' ? '%' : String(a.shift())); }
// The view for a location hash: Settings for #settings, Screen for #screen, else Radio. `els` has the three views
// and the header links; the link of the view shown is marked.
function viewOf(hash) { return hash === '#settings' ? 'settings' : hash === '#screen' ? 'screen' : 'radio'; }
function showView(hash, els) {
  const v = viewOf(hash);
  els.radio.hidden = v !== 'radio';
  els.settings.hidden = v !== 'settings';
  els.screen.hidden = v !== 'screen';
  els.links.forEach(a => a.classList.toggle('on', a.dataset.view === v));
  return v;
}
const pad2 = n => String(n).padStart(2, '0');
const hm = (d, utc) => utc ? `${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}` : `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const hms = (d, utc) => `${hm(d, utc)}:${pad2(utc ? d.getUTCSeconds() : d.getSeconds())}`;
// The header clock for the radio's UTC in ms (null until its clock is set): the time in the browser's zone and UTC.
function clockHtml(utcMs, t) {
  if (utcMs == null) return `<span class="nosig">${esc(t('web_time_not_set'))}</span>`;
  const d = new Date(utcMs);
  return `${hm(d, false)}<small>${hm(d, true)} UTC</small>`;
}
// Age of a sync as the radio shows it: whole minutes below an hour, else whole hours.
function ageText(ms, t) {
  const m = Math.floor(ms / 60000);
  return m < 60 ? fmt(t('age_min'), m) : fmt(t('age_h'), Math.floor(m / 60));
}
// The Time card's details: the radio's UTC, this browser's own clock with its zone, and the last sync with the
// server. `time` is the state's `time`, `utcMs` the radio's UTC now, `now` the browser's clock.
function timeHtml(time, utcMs, now, zone, t) {
  const rows = [
    ['UTC', utcMs == null ? esc(t('web_time_not_set')) : `<span class="mono">${hms(new Date(utcMs), true)}</span>`],
    [esc(t('web_browser')), `<span class="mono">${hms(new Date(now), false)}</span> (${esc(zone)})`],
    [esc(t('last_sync')), time.last_sync_ms == null || utcMs == null ? esc(t('never'))
      : esc(fmt(t('web_synced'), ageText(utcMs - time.last_sync_ms, t), time.server))],
  ];
  return `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
// ---- the screen ----
// A binary PBM (P4) as GET /api/screen sends it: {w, h, on(x, y)}, or null for anything else.
function pbm(bytes) {
  const tok = [];
  let i = 0;
  while (tok.length < 3 && i < bytes.length) {
    while (i < bytes.length && (bytes[i] === 10 || bytes[i] === 32)) i++;
    let s = '';
    while (i < bytes.length && bytes[i] !== 10 && bytes[i] !== 32) s += String.fromCharCode(bytes[i++]);
    tok.push(s);
  }
  const w = +tok[1], h = +tok[2], stride = (w + 7) >> 3, data = bytes.subarray(i + 1);
  if (tok[0] !== 'P4' || !(w > 0 && h > 0) || data.length < stride * h) return null;
  return { w, h, on: (x, y) => (data[y * stride + (x >> 3)] >> (7 - (x & 7))) & 1 };
}
// The screen as the OLED shows it, four canvas pixels a pixel: lit ones a pale blue 3x3 dot on black.
function drawScreen(ctx, s) {
  ctx.fillStyle = '#07090b';
  ctx.fillRect(0, 0, s.w * 4, s.h * 4);
  ctx.fillStyle = '#e6f4ff';
  for (let y = 0; y < s.h; y++)
    for (let x = 0; x < s.w; x++) if (s.on(x, y)) ctx.fillRect(x * 4, y * 4, 3, 3);
}
// ---- the knob ----
// Adds an input line to the lines waiting for POST /api/input; a turn after a turn the same way adds to it.
function queueInput(q, line) {
  const turn = l => { const m = /^turn (-?\d+)$/.exec(l); return m ? +m[1] : 0; };
  const n = turn(line), last = q.length ? turn(q[q.length - 1]) : 0;
  if (n && Math.sign(n) === Math.sign(last)) q[q.length - 1] = `turn ${last + n}`;
  else q.push(line);
  return q;
}
// Sends input lines to the radio one request at a time, at most 64 lines a request; lines given while a request is
// out wait for the next. `post(script)` resolves to true when the radio took the script; `done(ok)` follows each
// request. Returns the function that takes a line.
function inputSender(post, done) {
  const q = [];
  let busy = false;
  async function next() {
    if (busy || !q.length) return;
    busy = true;
    const ok = await post(q.splice(0, 64).join('\n'));
    busy = false;
    done(ok);
    next();
  }
  return line => { queueInput(q, line); next(); };
}
// ---- the frequency guide ----
const GUIDE_BASE = 'https://raw.githubusercontent.com/hoverboardhavoc/eibi-binary-table/main/v1/';
const DAY_NAMES = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
// EiBi's form of the day bits (bit 0 Monday): ranges of three or more days, single days joined with commas.
function daysText(days) {
  days &= 0x7F;
  if (!days) return '';
  let s = 0;
  if ((days & 0x41) === 0x41 && days !== 0x7F) {
    let back = 0, fwd = 0;
    while (days >> (6 - back) & 1) back++;
    while (days >> fwd & 1) fwd++;
    if (back + fwd >= 3) s = 7 - back;
  }
  const out = [];
  for (let i = 0; i < 7;) {
    const d = (s + i) % 7;
    if (!(days >> d & 1)) { i++; continue; }
    let len = 1;
    while (i + len < 7 && days >> ((s + i + len) % 7) & 1) len++;
    const last = DAY_NAMES[(d + len - 1) % 7];
    out.push(len >= 3 ? DAY_NAMES[d] + '-' + last : len === 2 ? DAY_NAMES[d] + ',' + last : DAY_NAMES[d]);
    i += len;
  }
  return out.join(',');
}
const hhmm4 = m => pad2(Math.floor(m / 60)) + pad2(m % 60);
// The cells of the Radio view's guide table for the state's `guide` entries: time, days, name, language, target.
function guideRows(entries, t) {
  return (entries || []).map(e => ({ on: e.on_air, cells: [`${hhmm4(e.start)}-${hhmm4(e.end)}`,
    e.irregular ? t('irr') : e.days === 0x7F ? t('daily') : daysText(e.days), e.name, e.language, e.target] }));
}
// Fills the table body with the rows, the guide's text set with textContent only; on-air rows are marked.
function renderGuide(tbody, entries, t, doc) {
  tbody.textContent = '';
  for (const r of guideRows(entries, t)) {
    const tr = doc.createElement('tr');
    if (r.on) tr.className = 'on';
    for (const c of r.cells) { const td = doc.createElement('td'); td.textContent = c; tr.appendChild(td); }
    tbody.appendChild(tr);
  }
}
// The Settings > Guide card's line for GET /api/guide.
function guideInfoText(g, t) {
  if (!g || !g.entries) return t('no_guide');
  return `EiBi ${g.season} · ${String(g.source_modified).slice(0, 10)} · ${fmt(t('web_entries'), g.entries)}`;
}
// SHA-256 of a Uint8Array as hex. The page is served over plain HTTP, where the browser offers no crypto.subtle.
function sha256(bytes) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98,
    0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6,
    0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3,
    0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e,
    0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116,
    0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814,
    0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const n = bytes.length, total = Math.ceil((n + 9) / 64) * 64, m = new Uint8Array(total);
  m.set(bytes);
  m[n] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(total - 8, Math.floor(n / 0x20000000));
  dv.setUint32(total - 4, (n * 8) >>> 0);
  const w = new Uint32Array(64), ror = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + 4 * i);
    for (let i = 16; i < 64; i++) {
      const s0 = ror(w[i - 15], 7) ^ ror(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = ror(w[i - 2], 17) ^ ror(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, k] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (k + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      k = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, k].forEach((v, i) => { h[i] = (h[i] + v) >>> 0; });
  }
  return h.map(v => v.toString(16).padStart(8, '0')).join('');
}
const kb = n => Math.round(n / 1024);
// Update: the data repository's manifest, then, unless its SHA-256 is the radio's, the table with its length and
// SHA-256 checked against the manifest, posted to the radio. `io` has fetch, post(bytes, sha256, onProgress) ->
// {ok, text}, and status(text). `radio` is GET /api/guide. Returns 'offline', 'failed', 'uptodate', 'mismatch' or
// 'updated'.
async function updateGuide(radio, io, t) {
  let m, bytes;
  try {
    const r = await io.fetch(GUIDE_BASE + 'manifest.json', { cache: 'no-store' });
    if (!r.ok) { io.status(t('download_failed')); return 'failed'; }
    m = await r.json();
  } catch (e) { io.status(t('web_no_internet')); return 'offline'; }
  if (m.format !== 1) { io.status(t('download_failed')); return 'failed'; }
  if (radio && radio.sha256 === m.sha256) { io.status(t('up_to_date')); return 'uptodate'; }
  try {
    const r = await io.fetch(GUIDE_BASE + 'stations.bin', { cache: 'no-store' });
    if (!r.ok) { io.status(t('download_failed')); return 'failed'; }
    if (r.body && r.body.getReader) {
      const parts = [], reader = r.body.getReader();
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); got += value.length;
        io.status(`${t('downloading')} ${kb(got)}/${kb(m.length)} KB`);
      }
      bytes = new Uint8Array(got);
      let at = 0;
      for (const p of parts) { bytes.set(p, at); at += p.length; }
    } else {
      bytes = new Uint8Array(await r.arrayBuffer());
    }
  } catch (e) { io.status(t('web_no_internet')); return 'offline'; }
  if (bytes.length !== m.length || sha256(bytes) !== m.sha256) { io.status(t('web_mismatch')); return 'mismatch'; }
  return sendGuide(bytes, m.sha256, io, t);
}
// Posts a table to the radio (From file: no SHA-256) and reports the result.
async function sendGuide(bytes, sha, io, t) {
  io.status(t('web_sending'));
  const r = await io.post(bytes, sha, done => io.status(`${t('web_sending')} ${kb(done)}/${kb(bytes.length)} KB`));
  io.status(r.ok ? t('guide_updated') : `${t('web_failed')}: ${r.text}`);
  return r.ok ? 'updated' : 'failed';

// The Firmware card's line for GET /api/firmware: what Check for update does and, after a firmware check since the
// radio's power-up, its result with the running version.
const FW_RESULTS = { 'updated': 'firmware_updated', 'up to date': 'up_to_date', 'no network': 'no_network',
  'download failed': 'download_failed', 'check failed': 'image_check_failed', 'cancelled': 'toast_cancelled' };
function firmwareText(f, t) {

  return `${t('web_check_note')} ${fmt(t('web_last_check'), t(FW_RESULTS[u.result]))} (${f.version}).`;
}
// Check for update: `post()` sends POST /api/firmware/update and resolves to the response. Returns the card's message:

async function checkFirmware(post, t) {
  let r;

// ---- the guide scan ----
// The Scan card's line for the state's `scan` (null before the first since the radio's power-up): the progress while

function scanText(sc, t) {
  if (!sc) return '';
  const scope = sc.band || t('all');
  if (sc.running) return `${fmt(t('scanning_s'), scope)} ${sc.done}/${sc.total}`;
  return `${t('last_scan')}: ${scope} ${sc.done}/${sc.total}` + (sc.results.length ? '' : ` · ${t('nothing_heard')}`);
}
// Fills the Scan card's table: frequency, name, RSSI and SNR, strongest first, the names set with textContent only. The
// row of the tuned frequency `hz` is marked; a press on a row calls tune(hz) with its frequency.
function renderScan(tbody, sc, hz, doc, tune) {
  tbody.textContent = '';
  for (const r of (sc && sc.results) || []) {
    const tr = doc.createElement('tr');
    if (Math.round(hz / 1000) === r.khz) tr.className = 'on';

// The Scan card's buttons: Scan band and Scan all post /api/scan with the scope, Stop deletes it. `send(method, body)`

function bindScan(el, send, msg, t) {
  const answer = status => msg(status === 200 ? '' : status === 400 ? t('no_guide') : t('web_failed'));
  el.band.onclick = async () => answer(await send('POST', { scope: 'band' }));
  el.all.onclick = async () => answer(await send('POST', { scope: 'all' }));
  el.stop.onclick = async () => answer(await send('DELETE'));
}
// The Time card's controls: the switch posts {sync}, Save posts the server typed, Default an empty server (the
// radio's default). `post(url, body)` sends it.
function bindTime(el, post) {
  el.sync.onchange = () => post('/api/time', { sync: el.sync.checked });
  el.save.onclick = () => post('/api/time', { server: el.server.value.trim() });
  el.def.onclick = () => post('/api/time', { server: '' });
  el.server.onkeydown = e => { if (e.key === 'Enter') el.save.onclick(); };
}
// The live state from /api/events. An EventSource reconnects by itself after a dropped connection but closes for
// good on an error answer, such as 503 when the radio's streams are all taken; a new one then opens 5 s later.
const EVENTS_RETRY_MS = 5000;
function openEvents(onState, onOffline, onOpen) {
  const es = new EventSource('/api/events');
  if (onOpen) es.onopen = onOpen;
  es.addEventListener('state', e => onState(JSON.parse(e.data)));
  es.onerror = () => {
    onOffline();
    if (es.readyState === EventSource.CLOSED) setTimeout(() => openEvents(onState, onOffline, onOpen), EVENTS_RETRY_MS);
  };
  return es;
}

<script>
const $ = id => document.getElementById(id);
let T = {}, lang = '', st = null;
let scanNote = '';  // the Scan card's refusal, shown in place of its line until the radio accepts a request
// The radio's UTC when the last state came, and the browser's clock then: the clock runs on between states.
let clockBase = { utc: null, at: 0 };
const radioUtc = () => clockBase.utc == null ? null : clockBase.utc + (Date.now() - clockBase.at);

const t = k => T[k] || k;
async function loadStrings() {
  T = await (await fetch('/api/strings')).json();
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = t(e.dataset.ph); });
  document.documentElement.lang = lang || 'en';
  $('guideInfo').textContent = guideInfoText(guideInfo, t);
  $('fwMsg').textContent = firmwareText(fwInfo, t);
  if (st) render(st);
}

async function post(url, body, method = 'POST') {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (r.ok) render(await r.json());
  return r.ok;
}

function fill(sel, items, value) {
  if (document.activeElement === sel) return;
  const key = items.join('|');
  if (sel.dataset.key !== key) {
    sel.innerHTML = '';
    items.forEach((v, i) => { const o = document.createElement('option'); o.value = i; o.textContent = v; sel.appendChild(o); });
    sel.dataset.key = key;

function showClock() {
  $('clock').innerHTML = clockHtml(radioUtc(), t);
  if (st && st.time) $('timeInfo').innerHTML = timeHtml(st.time, radioUtc(), Date.now(), Intl.DateTimeFormat().resolvedOptions().timeZone || '', t);
}

function render(s) {
  s = st = Object.assign(st || {}, s);
  if (s.lang !== lang) { lang = s.lang; loadStrings(); }
  if (s.time) {
    clockBase = { utc: s.time.utc_ms, at: Date.now() };
    $('timeSync').checked = s.time.sync;
    if (document.activeElement !== $('server')) $('server').value = s.time.server;
  }
  showClock();
  $('freq').textContent = s.freq;
  $('unit').textContent = s.unit;
  $('band').textContent = s.band;
  $('mode').textContent = s.mode;
  $('bars').textContent = '▂▃▅▆█'.slice(0, s.bars).padEnd(5, '·');
  $('rssi').textContent = `${s.rssi} dBµV, ${s.snr} dB`;
  $('rds').hidden = !s.rds;
  $('rds').innerHTML = rdsHtml(s.rds, s.hz, t);
  $('guide').hidden = !(s.guide && s.guide.length);
  renderGuide($('guideRows'), s.guide, t, document);

  $('scanCard').hidden = s.mode === 'FM';
  $('scanBand').hidden = !(s.bands && s.bands.includes(s.band));
  $('scanStop').hidden = !(s.scan && s.scan.running);
  $('scanMsg').textContent = scanNote || scanText(s.scan, t);
  $('scanTable').hidden = !(s.scan && s.scan.results.length);
  renderScan($('scanRows'), s.scan, s.hz, document, tuneTo);
  if (document.activeElement !== $('tuneIn')) $('tuneIn').value = s.mode === 'FM' ? (s.hz / 1e6).toFixed(2) : (s.hz / 1e3).toString();
  if (s.bands) fill($('bandSel'), s.bands, Math.max(0, s.bands.indexOf(s.band)));
  const modes = s.mode === 'FM' ? ['FM'] : s.ssb ? ['AM', 'LSB', 'USB'] : ['AM'];
  fill($('modeSel'), modes, modes.indexOf(s.mode));
  fill($('stepSel'), s.steps, s.stepIndex);
  fill($('bwSel'), s.bandwidths, s.bwIndex);
  if (document.activeElement !== $('vol')) $('vol').value = s.volume;
  $('mute').checked = s.muted;
  const tb = $('presets');
  tb.innerHTML = '';

    const tr = document.createElement('tr');
    const name = document.createElement('td');
    const a = document.createElement('a');

    a.onclick = e => { e.preventDefault(); post('/api/presets', { action: 'tune', index: i }); };
    name.appendChild(a);
    const f = document.createElement('td'); f.className = 'f'; f.textContent = `${p.text} ${p.mode}`;
    const act = document.createElement('td'); act.className = 'a';
    const btn = (label, title, fn) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.title = title; b.onclick = fn; act.appendChild(b); };
    btn('✎', t('web_rename'), () => { const n = prompt(t('web_name'), p.name); if (n) post('/api/presets', { action: 'rename', index: i, name: n }); });
    btn('↑', t('web_up'), () => i > 0 && post('/api/presets', { action: 'move', from: i, to: i - 1 }));
    btn('↓', t('web_down'), () => i < s.presets.length - 1 && post('/api/presets', { action: 'move', from: i, to: i + 1 }));
    btn('✕', t('web_delete'), () => post(`/api/presets?index=${i}`, null, 'DELETE'));
    tr.append(name, f, act);
    tb.appendChild(tr);
  });

    : `${t('not_joined_cap')} · ${t('access_point')} Havoc-Radio`;
  $('version').textContent = `Havoc Radio ${s.version}`;
  $('battery').textContent = t('battery_d').replace('%d', s.battery).replace('%%', '%');
}

function tuneTo(hz) { post('/api/tune', { hz: Math.round(hz) }); }
$('tune').onclick = () => {
  const v = parseFloat($('tuneIn').value.replace(',', '.'));
  if (!isNaN(v)) tuneTo(v * (st.mode === 'FM' ? 1e6 : 1e3));
};
$('tuneIn').onkeydown = e => { if (e.key === 'Enter') $('tune').onclick(); };
$('up').onclick = () => tuneTo(st.hz + st.stepHz);
$('rds').onclick = e => {
  const a = e.target.closest('a[data-hz]');
  if (a) { e.preventDefault(); tuneTo(+a.dataset.hz); }
};
$('down').onclick = () => tuneTo(st.hz - st.stepHz);
$('bandSel').onchange = e => post('/api/band', { band: st.bands[e.target.value] });
$('modeSel').onchange = e => post('/api/mode', { mode: e.target.selectedOptions[0].textContent });
$('stepSel').onchange = e => post('/api/step', { index: +e.target.value });
$('bwSel').onchange = e => post('/api/bandwidth', { index: +e.target.value });
$('vol').onchange = e => post('/api/volume', { volume: +e.target.value });
$('mute').onchange = e => post('/api/volume', { mute: e.target.checked });
$('presetAdd').onclick = () => { post('/api/presets', { action: 'add', name: $('presetName').value }); $('presetName').value = ''; };
$('join').onclick = () => post('/api/wifi', { ssid: $('ssid').value, password: $('pass').value });
bindScan({ band: $('scanBand'), all: $('scanAll'), stop: $('scanStop') }, async (method, body) => {
  try {
    const r = await fetch('/api/scan', { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
    if (r.ok) render(await r.json());
    return r.status;
  } catch (e) { return 0; }
}, s => { scanNote = s; $('scanMsg').textContent = s || scanText(st.scan, t); }, t);
bindTime({ sync: $('timeSync'), server: $('server'), save: $('serverSave'), def: $('serverDefault') }, async (url, body) => {
  $('timeMsg').textContent = '';
  if (!(await post(url, body))) $('timeMsg').textContent = t('web_failed');
});
const views = { radio: $('radioView'), settings: $('settingsView'), screen: $('screenView'),
  links: [...document.querySelectorAll('nav a')] };
// The Screen view reads GET /api/screen while it is shown and the tab is visible, one request at a time; an answer
// to the knob starts the next request at once.
const SCREEN_MS = 250;
let screenRunning = false, screenWake = null;
async function screenLoop() {
  screenRunning = true;
  while (!views.screen.hidden && !document.hidden) {
    try {
      const r = await fetch('/api/screen', { cache: 'no-store' });
      const s = r.ok && pbm(new Uint8Array(await r.arrayBuffer()));
      if (s) drawScreen($('screen').getContext('2d'), s);
    } catch (e) { /* the next pass tries again */ }

    screenWake = null;

}
// The knob and the side button under the screen press the radio's controls through POST /api/input. The ring

// 0.6 s and a long press at 0.6 s while held, the side button Back before 1 s and its hold at 1 s, as on the radio.
const sendInput = inputSender(async script => {
  try { return (await fetch('/api/input', { method: 'POST', body: script })).ok; } catch (e) { return false; }
}, ok => { $('knobMsg').textContent = ok ? '' : t('web_failed'); if (screenWake) screenWake(); });
function holdButton(ms, short, held) {
  let down = false, fired = false, timer = 0;
  return {
    start() {
      if (down) return;
      down = true; fired = false;
      timer = setTimeout(() => { fired = true; sendInput(held); }, ms);
    },
    end() {
      if (!down) return;
      down = false; clearTimeout(timer);
      if (!fired) sendInput(short);
    },

const cap = holdButton(600, 'press', 'long'), side = holdButton(1000, 'side', 'sidehold');
const knob = $('knob');
let knobAngle = 0, drag = null, wheelAcc = 0;
for (let i = 0; i < 40; i++) {
  const a = i * 9 * Math.PI / 180, l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  l.setAttribute('x1', 80 * Math.sin(a)); l.setAttribute('y1', -80 * Math.cos(a));
  l.setAttribute('x2', 88 * Math.sin(a)); l.setAttribute('y2', -88 * Math.cos(a));
  l.setAttribute('stroke', '#1a1f23'); l.setAttribute('stroke-width', '2.5');
  $('ridges').appendChild(l);
}
function turnKnob(d) {
  knobAngle += d * 18;

  sendInput(`turn ${d}`);
}
function knobPoint(e) {
  const r = knob.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 200 - 100, y = (e.clientY - r.top) / r.height * 200 - 100;
  return { d: Math.hypot(x, y), a: Math.atan2(x, -y) * 180 / Math.PI };

knob.addEventListener('pointerdown', e => {
  const p = knobPoint(e);
  knob.setPointerCapture(e.pointerId);
  drag = { a: p.a, acc: 0, onCap: p.d < 42 };
  if (drag.onCap) cap.start();
  e.preventDefault();
});
knob.addEventListener('pointermove', e => {
  if (!drag || drag.onCap) return;
  const p = knobPoint(e);
  if (p.d < 14) return;
  let da = p.a - drag.a;
  if (da > 180) da -= 360;
  if (da < -180) da += 360;
  drag.a = p.a; drag.acc += da;
  for (; drag.acc >= 18; drag.acc -= 18) turnKnob(1);
  for (; drag.acc <= -18; drag.acc += 18) turnKnob(-1);

const endDrag = () => { if (drag && drag.onCap) cap.end(); drag = null; };
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', endDrag);
knob.addEventListener('wheel', e => {
  e.preventDefault();
  wheelAcc += e.deltaY;
  for (; wheelAcc >= 30; wheelAcc -= 30) turnKnob(1);
  for (; wheelAcc <= -30; wheelAcc += 30) turnKnob(-1);

knob.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') turnKnob(1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') turnKnob(-1);
  else if (e.key === 'Enter' || e.key === ' ') { if (!e.repeat) cap.start(); }
  else return;

knob.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') cap.end(); });
const sideBtn = $('sideBtn');
sideBtn.addEventListener('pointerdown', e => { sideBtn.setPointerCapture(e.pointerId); side.start(); });
sideBtn.addEventListener('pointerup', () => side.end());
sideBtn.addEventListener('pointercancel', () => side.end());
sideBtn.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  e.preventDefault();
  if (!e.repeat) side.start();
});
sideBtn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') side.end(); });
function onView() { if (showView(location.hash, views) === 'screen' && !screenRunning) screenLoop(); }
addEventListener('hashchange', onView);
document.addEventListener('visibilitychange', onView);
onView();
setInterval(showClock, 1000);
$('upload').onclick = async () => {
  const f = $('fw').files[0];
  if (!f) return;
  $('otaMsg').textContent = t('web_press');
  try {
    const r = await fetch('/api/ota', { method: 'POST', body: f });
    $('otaMsg').textContent = r.ok ? t('web_installing') : `${t('web_failed')}: ${await r.text()}`;
  } catch (e) { $('otaMsg').textContent = t('web_failed'); }
};

// The Firmware card: Check for update restarts the radio into its download mode; the event stream reconnects once the
// radio is back, and the card then shows the result.
let fwInfo = null;
async function loadFirmware() {
  try { fwInfo = await (await fetch('/api/firmware')).json(); } catch (e) { fwInfo = null; }
  $('fwMsg').textContent = firmwareText(fwInfo, t);
}
$('fwCheck').onclick = async () => {
  $('fwMsg').textContent = await checkFirmware(() => fetch('/api/firmware/update', { method: 'POST' }), t);
};

// The Settings > Guide card.
let guideInfo = null;
async function loadGuide() {
  try { guideInfo = await (await fetch('/api/guide')).json(); } catch (e) { guideInfo = null; }
  $('guideInfo').textContent = guideInfoText(guideInfo, t);
}
// Posts a table with upload progress; the radio answers with GET /api/guide or 400 and the reason.
function postGuide(bytes, sha, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('POST', '/api/guide');
    if (sha) x.setRequestHeader('X-Guide-SHA256', sha);
    x.upload.onprogress = e => onProgress(e.loaded);
    x.onload = () => resolve({ ok: x.status === 200, text: x.responseText });
    x.onerror = () => resolve({ ok: false, text: t('web_offline') });
    x.send(bytes);
  });
}
const guideIo = { fetch: (u, o) => fetch(u, o), post: postGuide, status: s => { $('guideMsg').textContent = s; } };
$('guideUpdate').onclick = async () => { await updateGuide(guideInfo, guideIo, t); loadGuide(); };
$('guideFrom').onclick = () => $('guideFile').click();
$('guideFile').onchange = async () => {
  const f = $('guideFile').files[0];
  if (!f) return;
  await sendGuide(new Uint8Array(await f.arrayBuffer()), null, guideIo, t);
  $('guideFile').value = '';
  loadGuide();
};

async function start() {
  render(await (await fetch('/api/state')).json());
  loadGuide();
  openEvents(s => { render(s); $('status').textContent = ''; }, () => { $('status').textContent = t('web_offline'); },
    loadFirmware);
}
start();
